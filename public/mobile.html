<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONTROLLER - TACTICAL GUESS</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { overflow-y: auto; height: auto; padding: 10px; background: #05080a; color: white; }
        .mobile-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .secret-banner { background: rgba(255, 255, 255, 0.05); border: 2px solid #333; padding: 15px; border-radius: 12px; text-align: center; }
        .grid-mobile { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .char-card-mobile { background: #111; border: 1px solid #333; padding: 12px 5px; border-radius: 6px; text-align: center; color: #fff; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .char-card-mobile.eliminated { opacity: 0.2; text-decoration: line-through; border-color: var(--red); }
        .btn-main { padding: 18px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; text-transform: uppercase; cursor: pointer; }
        .btn-guess { background: var(--red); color: white; margin-top: 10px; }
        .btn-join { background: var(--p1-color); color: black; }
        .btn-reset { background: #222; color: #888; font-size: 0.7rem; padding: 10px; margin-top: 10px; }
        .loading-screen { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; }
        .join-card { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; box-sizing: border-box; }
        .join-card input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0e1218; color: white; text-transform: uppercase; }
        .error-msg { color: #ff7171; font-size: 0.8rem; min-height: 18px; margin: 0; }
    </style>
</head>
<body>
    <div class="mobile-container" id="game-container">
        <div id="setup-zone" class="loading-screen">
            <div class="join-card">
                <h3 style="margin-top:0;">UNIRSE AL LOBBY</h3>
                <input id="lobby-code-input" type="text" maxlength="6" placeholder="CÓDIGO DE LOBBY">
                <input id="name-input" type="text" maxlength="20" placeholder="TU NOMBRE">
                <button id="join-btn" class="btn-main btn-join" onclick="joinLobby()">ENTRAR</button>
                <p id="join-error" class="error-msg"></p>
            </div>
            <h2 id="role-display" class="blink">CONECTANDO...</h2>
        </div>
    </div>

    <script>
        const socket = io();
        let myRole = "";

        const urlCode = new URLSearchParams(window.location.search).get('code');
        if (urlCode) document.getElementById('lobby-code-input').value = urlCode.toUpperCase();

        function joinLobby() {
            const code = document.getElementById('lobby-code-input').value.trim();
            const name = document.getElementById('name-input').value.trim();
            document.getElementById('join-error').textContent = '';
            socket.emit('join-lobby', { code, name });
        }

        socket.on('join-error', message => {
            document.getElementById('join-error').textContent = message;
        });

        socket.on('assign-role', data => {
            myRole = data.role;
            const display = document.getElementById('role-display');
            display.textContent = `${data.role} · ${data.name}`;
            display.classList.remove('blink');
            document.querySelector('.join-card').style.display = 'none';
        });

        socket.on('waiting-room-update', (data) => {
            if (myRole && !data.gameStarted) {
                const display = document.getElementById('role-display');
                display.textContent = data.readyToStart
                    ? `${myRole} · LISTO, ESPERANDO START GAME EN TV`
                    : `${myRole} · ESPERANDO AL OTRO JUGADOR`;
            }
        });

        socket.on('game-setup', data => {
            const container = document.getElementById('game-container');
            const accentColor = (myRole === 'JUGADOR 1') ? 'var(--p1-color)' : 'var(--p2-color)';

            container.innerHTML = `
                <div class="secret-banner" style="border-color: ${accentColor}">
                    <p style="margin:0; font-size: 0.7rem; color: #aaa;">ERES ESTE PERSONAJE:</p>
                    <h2 style="margin:5px 0; color: ${accentColor}; font-size: 1.6rem;">${data.secret}</h2>
                    <p style="margin:0; font-size: 0.6rem; color: #666;">El rival debe adivinar quién eres tú.</p>
                </div>
                <div style="text-align:center; font-size:0.7rem; color:var(--p1-color)">BUSCA AL RIVAL ABAJO:</div>
                <div class="grid-mobile" id="mobile-grid"></div>
                <button class="btn-main btn-guess" onclick="guessWho()">¡LO TENGO!</button>
                <button class="btn-main btn-reset" onclick="requestReset()">REINICIAR TODO</button>
            `;

            const grid = document.getElementById('mobile-grid');
            data.board.forEach(p => {
                const b = document.createElement('div');
                b.className = 'char-card-mobile';
                b.id = `mobile-char-${p.id}`;
                b.textContent = p.nombre;
                b.onclick = () => {
                    b.classList.toggle('eliminated');
                    socket.emit('discard-character', { role: myRole, id: p.id });
                };
                grid.appendChild(b);
            });
        });

        function guessWho() {
            const name = prompt("¿QUIÉN ES EL PERSONAJE DEL RIVAL?");
            if (name) socket.emit('declare-winner', { player: myRole, character: name });
        }

        function requestReset() {
            if(confirm("¿Reiniciar para todos?")) socket.emit('request-reset');
        }

        socket.on('guess-error', msg => alert(msg));
        socket.on('reset-game', () => location.reload());
    </script>
</body>
</html>
